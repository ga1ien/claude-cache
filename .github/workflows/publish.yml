name: Publish to PyPI

# Disabled 2026-08-17. Cache is superseded by braintied/watchtower.
# A GitHub release must not upload a new wheel.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'type PUBLISH to upload — default is off on purpose'
        required: true
        default: 'NO'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      if: ${{ github.event.inputs.confirm == 'PUBLISH' }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m twine upload dist/*