name: Yank PyPI (superseded)

on:
  workflow_dispatch:

jobs:
  yank:
    runs-on: ubuntu-latest
    steps:
      - name: Yank every claude-cache version
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          REASON='Superseded by https://github.com/braintied/watchtower'
          VERSIONS='0.1.0 0.2.0 0.2.1 0.6.0 0.6.2 0.6.4 0.6.5 0.6.6 0.6.7 0.6.8 0.7.0 0.8.0 0.8.1 0.8.2 0.9.0 0.9.1 0.9.2'
          fail=0
          for v in $VERSIONS; do
            echo "yanking $v"
            # Warehouse web form used by the manage UI. Token auth may work.
            code=$(curl -sS -o /tmp/yank.out -w '%{http_code}' \
              -u "__token__:${TWINE_PASSWORD}" \
              -X POST \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "confirm_yank=true" \
              --data-urlencode "yanked_reason=${REASON}" \
              "https://pypi.org/manage/project/claude-cache/release/${v}/")
            echo "  manage http ${code}"
            if [ "$code" != "200" ] && [ "$code" != "302" ] && [ "$code" != "303" ]; then
              fail=1
            fi
          done
          if [ "$fail" != "0" ]; then
            echo "one or more yanks did not return 200/302" >&2
            exit 1
          fi
